name: Performance regression benchmark

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/lowpower_llm_cluster/**"
      - "scripts/benchmark_discovery_pipeline.py"
      - "scripts/check_perf_regression.py"
      - "scripts/check_hardware_class_baseline.py"
      - "benchmarks/perf-baseline.json"
      - "benchmarks/hardware-class-baselines.json"
      - ".github/workflows/perf.yml"

jobs:
  perf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - run: python scripts/benchmark_discovery_pipeline.py --counts 1000 10000 --output results/discovery-perf.json
      - run: python scripts/check_perf_regression.py --baseline benchmarks/perf-baseline.json --current results/discovery-perf.json
      - run: python scripts/check_hardware_class_baseline.py --current results/discovery-perf.json
      - run: python scripts/profile_jsonld.py --products 1000 10000 --repeats 2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: discovery-perf
          path: results/discovery-perf.json
