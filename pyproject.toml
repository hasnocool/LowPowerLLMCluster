[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "lowpower-llm-cluster"
version = "0.5.0"
description = "Catalog-first research and buying planner for low-power local LLM hardware, with asynchronous market discovery and optional benchmark evidence tooling."
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [{name = "LowPowerLLMCluster contributors"}]
dependencies = []

[project.scripts]
llm-cluster = "lowpower_llm_cluster.cli:main"
llm-cluster-bench = "lowpower_llm_cluster.benchmarking.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
