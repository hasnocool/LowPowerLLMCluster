[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "lowpower-llm-cluster"
version = "0.5.0"
description = "Catalog-first research and buying planner for low-power local LLM hardware with asynchronous market discovery."
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [{name = "LowPowerLLMCluster contributors"}]
dependencies = ["aiohttp>=3.14.3,<4", "ijson>=3.3,<4"]

[project.optional-dependencies]
telemetry = [
  "opentelemetry-api>=1.30,<2",
  "opentelemetry-sdk>=1.30,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.30,<2"
]

[project.scripts]
llm-cluster = "lowpower_llm_cluster.cli:main"
llm-cluster-service = "lowpower_llm_cluster.service_cli:main"
llm-cluster-distributed = "lowpower_llm_cluster.distributed_cli:main"
llm-cluster-install-service = "lowpower_llm_cluster.service_install:main"
llm-cluster-bench = "lowpower_llm_cluster.benchmarking.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
