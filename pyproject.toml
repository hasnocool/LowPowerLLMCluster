[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "lowpower-llm-cluster"
version = "0.5.0"
description = "Catalog-first research and buying planner for low-power local LLM hardware, with autonomous market intelligence and optional benchmark evidence tooling."
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [{name = "LowPowerLLMCluster contributors"}]
dependencies = ["httpx>=0.28,<1", "pypdf>=5,<7"]

[project.scripts]
llm-cluster = "lowpower_llm_cluster.cli:main"
llm-cluster-market = "lowpower_llm_cluster.market_cli:main"
llm-cluster-refresh = "lowpower_llm_cluster.refresh_cli:main"
llm-cluster-bench = "lowpower_llm_cluster.benchmarking.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
