name: Regenerate discovery catalog view

on:
  push:
    branches:
      - feature/ryzen-rk-discovery

permissions:
  contents: write

concurrency:
  group: regenerate-discovery-parts
  cancel-in-progress: false

jobs:
  regenerate:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/ryzen-rk-discovery
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Render PARTS.md
        run: python scripts/render_parts_table.py
      - name: Commit generated view
        shell: bash
        run: |
          if git diff --quiet -- PARTS.md; then
            echo "PARTS.md already current."
            exit 0
          fi
          git config user.name "LowPowerLLMCluster catalog bot"
          git config user.email "actions@users.noreply.github.com"
          git add PARTS.md
          git commit -m "chore: regenerate corrected discovery catalog [skip ci]"
          git push origin HEAD:feature/ryzen-rk-discovery
